# nginx reverse proxy with TLS for the Chest Tracker server.
# Replace chests.example.com, obtain a certificate (e.g. `certbot --nginx -d chests.example.com`),
# and set "TrustedProxies": ["127.0.0.1"] in appsettings.json when nginx runs on the same host.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chests.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chests.example.com;

    ssl_certificate     /etc/letsencrypt/live/chests.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chests.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5280;
        proxy_http_version 1.1;

        # SignalR WebSockets (WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
